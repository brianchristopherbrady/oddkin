<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      [data-oddkin-preview] {
        container: preview / inline-size;
      }
      fixture-button {
        margin-inline-start: 0;
      }
      @container preview (min-width: 300px) {
        fixture-button {
          margin-inline-start: 10px;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@oddkin/core/scope": "../../../core/dist/scope/index.js",
          "@oddkin/workbench/frame": "../../dist/frame/index.js"
        }
      }
    </script>
    <script>
      // Vitest's browser runner wraps dynamic imports in the modules it serves with a global that
      // only its own test frame defines; this preview frame is a plain document.
      window.__vitest_browser_runner__ ??= { wrapDynamicImport: (load) => load() };
    </script>
    <script type="module">
      import '@oddkin/workbench/frame';
    </script>
  </head>
  <body>
    <main data-oddkin-preview></main>
  </body>
</html>
