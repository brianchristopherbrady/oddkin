name: Registry smoke

# The published packages, installed from the npm registry into the same fresh projects CI builds
# from packed tarballs (scripts/packed-consumers.mjs with ODDKIN_CONSUMERS_FROM): the packed-consumer
# pages, the Vite TypeScript, React, Vue, and Svelte apps, and the golden path (a library, its
# Workbench site, and an app on it). Weekly, and by hand after a publish.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: A dist-tag or version of the @oddkin packages
        default: beta

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # Playwright starts every web server in playwright.config.ts; Workbench's and the docs' need the build.
      - run: npm run build
      - run: npx playwright test e2e/fresh-consumers.spec.ts e2e/packed-consumers.spec.ts e2e/components-only.spec.ts e2e/autoload.spec.ts e2e/golden-path.spec.ts
        env:
          ODDKIN_CONSUMERS_FROM: ${{ inputs.version || 'beta' }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-smoke-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # A failed run opens or comments on the issue "Failing workflow: Registry smoke"; the next passing
  # run closes it (scripts/ci/failure-issue.mjs).
  report:
    needs: smoke
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
        with:
          script: |
            const { report } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/failure-issue.mjs`);
            await report({ github, context, result: process.env.RESULT });
