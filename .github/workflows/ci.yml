name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19; change deliberately after Playwright supports it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the analyzer reads page dates from git and skips them in a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # The same checks as `npm run verify`; each runs even after an earlier one fails. `npm test`
      # runs here as its parts: the build, the node project, and the browser project one engine at a
      # time with --no-file-parallelism (the owner's interim rule: Firefox and WebKit fail under
      # parallel load; every file passes alone). The e2e run includes the fresh projects
      # (e2e/fresh-consumers.spec.ts).
      - run: npm run lint
      - if: ${{ !cancelled() }}
        run: npm run typecheck
      - if: ${{ !cancelled() }}
        run: npm run build
      - if: ${{ !cancelled() }}
        run: npx vitest run --project node
      - if: ${{ !cancelled() }}
        run: npx vitest run --project browser --browser.name=chromium --no-file-parallelism
      - if: ${{ !cancelled() }}
        run: npx vitest run --project browser --browser.name=firefox --no-file-parallelism
      - if: ${{ !cancelled() }}
        run: npx vitest run --project browser --browser.name=webkit --no-file-parallelism
      - if: ${{ !cancelled() }}
        run: npm run verify:metadata
      - if: ${{ !cancelled() }}
        run: npm run size
      - if: ${{ !cancelled() }}
        run: npm run test:e2e
      - if: ${{ !cancelled() }}
        run: npm run verify:packs
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
