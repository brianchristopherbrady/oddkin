name: Docs site

# Builds apps/docs as a static site and deploys it to GitHub Pages (https://oddkin.dev).
# Repository settings: Pages source "GitHub Actions"; the custom domain is set there too.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pinned like CI: ubuntu-latest moves to Ubuntu 26 from 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the analyzer reads page dates from git and skips them in a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node apps/docs/build.mjs --out .oddkin/docs-site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .oddkin/docs-site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # A failed build or deploy opens or comments on the issue "Failing workflow: Docs site"; the next
  # passing run closes it (scripts/ci/failure-issue.mjs).
  report:
    needs: [build, deploy]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci
      - uses: actions/github-script@v9
        env:
          RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
        with:
          script: |
            const { report } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/failure-issue.mjs`);
            await report({ github, context, result: process.env.RESULT });
