# Weekly update proposals for npm packages and GitHub Actions (RF-13), grouped to keep the noise down.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The workspace's own packages: scripts/release/set-versions.mjs steps them.
      - dependency-name: '@oddkin/*'
      # The analyzer pins TypeScript 5.9 for its compiler API, which TypeScript 7 does not ship (ADR 0018).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Node's types follow the supported Node line (24), not the newest Node.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
