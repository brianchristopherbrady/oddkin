<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'sha256-5PV9O768mcO/eiBC6Vzelw1IkheEEtJlJCnKWim9VIs='; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types oddkin-template"
    />
    <title>Explicit imports · Oddkin</title>
    <link rel="stylesheet" href="../../packages/tokens/dist/css/default.css" />
    <link rel="stylesheet" href="../../packages/components/dist/css/layout.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "@oddkin/components/define/alert": "../../packages/components/dist/alert/alert.define.js",
          "@oddkin/components/define/badge": "../../packages/components/dist/badge/badge.define.js",
          "@oddkin/components/define/button": "../../packages/components/dist/button/button.define.js",
          "@oddkin/components/define/card": "../../packages/components/dist/card/card.define.js",
          "@oddkin/components/define/input": "../../packages/components/dist/input/input.define.js",
          "@oddkin/core/controllers/active-descendant": "../../packages/core/dist/controllers/active-descendant.js",
          "@oddkin/core/controllers/announce": "../../packages/core/dist/controllers/announce.js",
          "@oddkin/core/controllers/focus": "../../packages/core/dist/controllers/focus.js",
          "@oddkin/core/controllers/form": "../../packages/core/dist/controllers/form.js",
          "@oddkin/core/controllers/observe": "../../packages/core/dist/controllers/observe.js",
          "@oddkin/core/controllers/position": "../../packages/core/dist/controllers/position.js",
          "@oddkin/core/controllers/resize": "../../packages/core/dist/controllers/resize.js",
          "@oddkin/core/controllers/typeahead": "../../packages/core/dist/controllers/typeahead.js",
          "@oddkin/core/diagnostics": "../../packages/core/dist/diagnostics/index.js",
          "@oddkin/core/element": "../../packages/core/dist/element/index.js",
          "@oddkin/core/helpers/live": "../../packages/core/dist/helpers/live.js",
          "@oddkin/core/helpers/style-map": "../../packages/core/dist/helpers/style-map.js",
          "@oddkin/core/i18n": "../../packages/core/dist/i18n/index.js",
          "@oddkin/core/reactive": "../../packages/core/dist/reactive/index.js",
          "@oddkin/core/styles": "../../packages/core/dist/styles/index.js",
          "@oddkin/core/template": "../../packages/core/dist/template/index.js",
          "@oddkin/tokens/refs": "../../packages/tokens/dist/refs/index.js"
        }
      }
    </script>
    <script type="module" src="./explicit.js"></script>
  </head>
  <body>
    <main class="odd-stack odd-box">
      <h1>Explicit imports</h1>
      <p>
        The same markup with an explicit <code>define/*</code> import per element, the recommended
        production path.
      </p>
      <odd-alert tone="info" label="Billing changes"
        >Invoices move to the first of the month.</odd-alert
      >
      <odd-card label="Billing">
        <h2 slot="header">Billing <odd-badge tone="success">Active</odd-badge></h2>
        <odd-input label="Email" name="email" type="email" value="ada@example.com"></odd-input>
        <odd-button slot="footer" appearance="primary">Save</odd-button>
      </odd-card>
    </main>
  </body>
</html>
