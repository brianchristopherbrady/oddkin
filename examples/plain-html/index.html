<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oddkin plain-HTML consumer</title>
    <script type="importmap">
      {
        "imports": {
          "@oddkin/core": "../../packages/core/dist/index.js",
          "@oddkin/core/reactive": "../../packages/core/dist/reactive/index.js",
          "@oddkin/core/scope": "../../packages/core/dist/scope/index.js",
          "@oddkin/core/diagnostics": "../../packages/core/dist/diagnostics/index.js",
          "@oddkin/tokens": "../../packages/tokens/dist/index.js",
          "@oddkin/state": "../../packages/state/dist/index.js",
          "@oddkin/state/context": "../../packages/state/dist/context/index.js",
          "@oddkin/app": "../../packages/app/dist/index.js",
          "@oddkin/components": "../../packages/components/dist/index.js"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <h1>Oddkin plain-HTML consumer</h1>
      <p>Loads built packages through an import map, with no bundler.</p>
      <ul id="packages" aria-label="Loaded packages"></ul>
    </main>
    <script type="module">
      import { packageName as core } from '@oddkin/core';
      import { packageName as tokens } from '@oddkin/tokens';
      import { packageName as state, internalDependencies as stateDeps } from '@oddkin/state';
      import { packageName as app } from '@oddkin/app';
      import { packageName as components } from '@oddkin/components';

      const list = document.getElementById('packages');
      for (const name of [core, tokens, state, app, components]) {
        const item = document.createElement('li');
        item.textContent = name;
        list.append(item);
      }
      document.body.dataset.stateDeps = stateDeps.join(',');
      document.body.dataset.ready = 'true';
    </script>
  </body>
</html>
