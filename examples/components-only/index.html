<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'sha256-YfRSNstdfj1m02hEGdol/DTBhP0+TkiJtrHVxD8RkM8='; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types oddkin-template"
    />
    <title>Components only — @oddkin/components without state or app packages</title>
    <link rel="stylesheet" href="../../packages/tokens/dist/css/default.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "@oddkin/core/element": "../../packages/core/dist/element/index.js",
          "@oddkin/core/reactive": "../../packages/core/dist/reactive/index.js",
          "@oddkin/core/scope": "../../packages/core/dist/scope/index.js",
          "@oddkin/core/styles": "../../packages/core/dist/styles/index.js",
          "@oddkin/core/template": "../../packages/core/dist/template/index.js",
          "@oddkin/tokens/refs": "../../packages/tokens/dist/refs/index.js",
          "@oddkin/components/define/button": "../../packages/components/dist/button/button.define.js",
          "@oddkin/components/define/card": "../../packages/components/dist/card/card.define.js"
        }
      }
    </script>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <main>
      <h1>Components only</h1>
      <p>
        <code>@oddkin/components</code> with <code>@oddkin/core</code> and
        <code>@oddkin/tokens</code>: no state, app, or tooling packages, no build step for this
        page.
      </p>
      <odd-card label="Billing">
        <h2 slot="header">Billing</h2>
        <form id="billing">
          <label>Email <input name="email" type="email" value="ada@example.com" required /></label>
        </form>
        <p id="result" role="status"></p>
        <div slot="footer" class="actions">
          <odd-button type="reset" form="billing">Reset</odd-button>
          <odd-button
            id="save"
            appearance="primary"
            type="submit"
            name="intent"
            value="save"
            form="billing"
            >Save</odd-button
          >
        </div>
      </odd-card>
      <odd-card variant="filled">
        <p>A card with no name is not a landmark.</p>
      </odd-card>
    </main>
  </body>
</html>
