<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'sha256-M6nyPVw8NM4eYOAiWqZNOFq5a++mn5OOPHvPK2rCHSk='; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types oddkin-template"
    />
    <title>Components only — @oddkin/components without state or app packages</title>
    <link rel="stylesheet" href="../../packages/tokens/dist/css/default.css" />
    <link rel="stylesheet" href="../../packages/components/dist/css/layout.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "@oddkin/core/controllers/form": "../../packages/core/dist/controllers/form.js",
          "@oddkin/core/element": "../../packages/core/dist/element/index.js",
          "@oddkin/core/helpers/live": "../../packages/core/dist/helpers/live.js",
          "@oddkin/core/i18n": "../../packages/core/dist/i18n/index.js",
          "@oddkin/core/reactive": "../../packages/core/dist/reactive/index.js",
          "@oddkin/core/scope": "../../packages/core/dist/scope/index.js",
          "@oddkin/core/styles": "../../packages/core/dist/styles/index.js",
          "@oddkin/core/template": "../../packages/core/dist/template/index.js",
          "@oddkin/tokens/refs": "../../packages/tokens/dist/refs/index.js",
          "@oddkin/components/define/button": "../../packages/components/dist/button/button.define.js",
          "@oddkin/components/define/card": "../../packages/components/dist/card/card.define.js",
          "@oddkin/components/define/input": "../../packages/components/dist/input/input.define.js"
        }
      }
    </script>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <main class="odd-stack odd-stack-loose">
      <h1>Components only</h1>
      <p>
        <code>@oddkin/components</code> with <code>@oddkin/core</code> and
        <code>@oddkin/tokens</code>: no state, app, or tooling packages, no build step for this
        page.
      </p>
      <odd-card label="Billing">
        <h2 slot="header">Billing</h2>
        <form id="billing">
          <odd-input
            label="Email"
            description="Receipts go to this address."
            name="email"
            type="email"
            autocomplete="email"
            value="ada@example.com"
            required
          ></odd-input>
        </form>
        <p id="result" role="status"></p>
        <div slot="footer" class="actions odd-row">
          <odd-button type="reset" form="billing">Reset</odd-button>
          <odd-button
            id="save"
            appearance="primary"
            type="submit"
            name="intent"
            value="save"
            form="billing"
            >Save</odd-button
          >
          <odd-button id="help" appearance="ghost" label="Billing help">
            <svg aria-hidden="true" viewBox="0 0 16 16" width="16" height="16" fill="none">
              <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5" />
              <path
                d="M6.2 6.3a1.9 1.9 0 1 1 2.6 1.7c-.5.2-.8.6-.8 1.1v.3"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
              <circle cx="8" cy="11.5" r="0.9" fill="currentColor" />
            </svg>
          </odd-button>
        </div>
      </odd-card>
      <odd-card appearance="elevated">
        <h2 slot="header">Plan</h2>
        <p>Team plan, billed yearly.</p>
      </odd-card>
      <odd-card appearance="filled">
        <p>A card with no name is not a landmark.</p>
      </odd-card>
    </main>
  </body>
</html>
