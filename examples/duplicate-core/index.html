<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Two copies of @oddkin/core on one page</title>
    <script type="module" src="./dist/consumer-a.js"></script>
    <script type="module" src="./dist/consumer-b.js"></script>
  </head>
  <body>
    <main>
      <h1>Two independently built consumers</h1>
      <p>Each script below is its own bundle with its own copy of <code>@oddkin/core</code>.</p>
      <a-greeting name="Ada"></a-greeting>
      <odd-button>Registered by consumer A</odd-button>
      <p>Consumer B's element, bound to consumer A's signal: <b-mirror></b-mirror></p>
    </main>
  </body>
</html>
