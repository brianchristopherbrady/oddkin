<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vite and TypeScript consumer</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main class="odd-stack consumer">
      <odd-card>
        <h1 slot="header">Sign up</h1>
        <form id="signup" class="odd-stack">
          <odd-input name="email" label="Email" type="email" required></odd-input>
          <odd-checkbox name="updates" value="yes">Send me updates</odd-checkbox>
          <odd-button type="submit" appearance="primary">Join</odd-button>
        </form>
        <output id="result"></output>
      </odd-card>
    </main>
  </body>
</html>
